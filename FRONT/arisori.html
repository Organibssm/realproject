<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아리소리 페이 - 소마고 매점 온라인</title>
    <!-- Google Fonts: Outfit (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.style.css">
    <script src="main.script.js" defer></script>
</head>
<body>
    <!-- 야간 하늘 배경 (다크모드용 레이어) -->
    <div class="night_sky">
      <div class="stars"></div>
      <div class="moon"></div>
    </div>

    <!-- 전체 감싸는 메인 컨테이너 -->
    <div class="app_container">
        <!-- 헤더 영역 -->
        <header class="main_header">
            <div class="logo_area" onclick="location.href='main.html'" style="cursor: pointer;">
                <img src="logo.jpg" class="logo">
                <h1 class="logo_text">소마고 매점 <span>ONline</span></h1>
            </div>
            
            <!-- 우측 로그인 버튼 및 테마 토글 영역 -->
            <div class="header_right_area">
                <button class="login_open_btn" id="loginOpenBtn"> 로그인</button>
                <div class="header_actions">
                    <div id="slingshot_container">
                        <button class="theme_toggle" id="themeToggle" aria-label="다크 모드 토글">🌙</button>
                        <div id="bat" title="드래그해서 버튼에 쏘세요!">🦇</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main_content arisori_main">
            <!-- 잔액 및 바코드 카드 -->
            <div class="arisori_card balance_card">
                <div class="balance_info">
                    <h3 class="user_name"><strong>이현수</strong> 님의 잔액</h3>
                    <div class="balance_amount"><span>9,000</span>원</div>
                </div>
                <div class="barcode_section">
                    <div class="barcode_label">결제 바코드</div>
                    <div class="barcode_box">
                        <div class="barcode_img"></div>
                    </div>
                </div>
            </div>

            <!-- 공지사항 및 메뉴 카드 -->
            <div class="arisori_card notice_card">
                <div class="notice_header">
                    <h3 class="notice_title">공지사항</h3>
                    <a href="#" class="view_all">전체보기 &gt;</a>
                </div>
                <div class="notice_body">
                    <p class="empty_notice">등록된 공지사항이 없습니다.</p>
                </div>
                
                <div class="menu_buttons_wrapper">
                    <button class="menu_chip">
                        <div class="chip_icon icon_yellow">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <span class="chip_text">사용내역</span>
                        <span class="chip_arrow">&gt;</span>
                    </button>
                    <button class="menu_chip">
                        <div class="chip_icon icon_orange">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        </div>
                        <span class="chip_text">사용방법</span>
                        <span class="chip_arrow">&gt;</span>
                    </button>
                    <button class="menu_chip">
                        <div class="chip_icon icon_yellow">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        </div>
                        <span class="chip_text">상품목록</span>
                        <span class="chip_arrow">&gt;</span>
                    </button>
                    <button class="menu_chip">
                        <div class="chip_icon icon_orange">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        </div>
                        <span class="chip_text">문의하기</span>
                        <span class="chip_arrow">&gt;</span>
                    </button>
                </div>
            </div>
        </main>
        
        <footer class="main_footer">
            <p>© 2026 소마고 매점 온라인. All rights reserved.</p>
        </footer>
    </div>
    
    <!-- 로그인 및 회원가입 모달 다이얼로그 -->
    <div id="loginModal" class="modal_backdrop" aria-hidden="true">
        <div class="modal_container">
            <button class="modal_close_btn" id="modalCloseBtn" aria-label="닫기">&times;</button>
            
            <div class="modal_tabs">
                <button class="modal_tab_btn active" id="tabLoginBtn">로그인</button>
                <button class="modal_tab_btn" id="tabSignupBtn">회원가입</button>
            </div>
            
            <form id="loginForm" class="modal_form">
                <div class="form_group">
                    <label for="studentId">학번</label>
                    <input type="text" id="studentId" placeholder="예: 3101" required>
                </div>
                
                <div class="form_group signup_only" id="signupNameGroup">
                    <label for="studentName">이름</label>
                    <input type="text" id="studentName" placeholder="예: 홍길동">
                </div>
                
                <div class="form_group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                
                <div class="form_group checkbox_group signup_only" id="signupAgreeGroup">
                    <div class="checkbox_wrapper">
                        <input type="checkbox" id="privacyAgree">
                        <label for="privacyAgree">개인정보 수집 및 이용 동의 (필수)</label>
                    </div>
                </div>
                
                <button type="submit" class="submit_btn" id="submitFormBtn">로그인</button>
            </form>
        </div>
    </div>
</body>
</html>
